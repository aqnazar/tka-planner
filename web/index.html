<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TKA Planner</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>

<header>
  <h1>TKA Planner</h1>
  <form id="open-form">
    <label>Case
      <select id="case-picker"><option value="">choose or type a folder</option></select>
    </label>
    <label>Folder <input id="folder" type="text" placeholder="path to the patient folder" size="34"></label>
    <label>Side
      <select id="side"><option value="left">Left</option><option value="right">Right</option></select>
    </label>
    <label>Library <input id="library" type="text" placeholder="implant library (optional)" size="24"></label>
    <label title="From a long-leg film or scanogram. A knee-only scan cannot give it; it is recorded as entered.">Femur length <input id="femur-length" type="number" min="300" max="690" step="1" placeholder="mm, optional" style="width:8.5em"></label>
    <label title="What the femur length measures. A scanogram usually gives the top of the femoral head to the distal condyles; the planner then subtracts an assumed 40 mm (pending calibration) to get hip centre to knee centre, and the plan says so.">measured
      <select id="femur-length-type"><option value="hip_to_knee">hip centre to knee centre</option><option value="head_top_to_condyle">head top to condyles</option></select>
    </label>
    <label title="Sizes the phantom femur's head: male 49.65 mm, female 44.41 mm (3D CT, Yang and Qian 2025). Not given, the head is 0.1 of the maximum femur length. Needs a femur length.">Sex
      <select id="sex"><option value="">not given</option><option value="male">Male</option><option value="female">Female</option></select>
    </label>
    <button type="submit" id="open">Open</button>
  </form>
  <p class="disclaimer">Research and demonstration only. Not a medical device.</p>
</header>

<main>
  <aside id="panel">
    <nav id="modes">
      <button type="button" data-mode="plan" class="active">Plan</button>
      <button type="button" data-mode="reduce">Reduce</button>
    </nav>

    <section id="plan-mode">
      <div class="actions">
        <button type="button" id="commit">Commit</button>
        <button type="button" id="reset">Reset adjustments</button>
      </div>
      <div id="controls"></div>
    </section>

    <section id="reduce-mode" hidden>
      <div id="trial"></div>
      <div class="actions">
        <button type="button" id="play">Play arc</button>
        <button type="button" id="reset-trial">Reset pose</button>
      </div>
      <label class="arc">Arc to
        <input id="arc-max" type="number" value="120" min="10" max="150" step="5"> deg
      </label>
    </section>

    <section class="actions export">
      <label>Export to <input id="export-path" type="text" placeholder="output folder" size="22"></label>
      <button type="button" id="export">Export plan</button>
      <button type="button" id="open-report">Open report</button>
    </section>

    <label class="clean"><input id="clean" type="checkbox"> Clean viewport</label>
  </aside>

  <div id="view">
    <div id="legend" hidden></div>
  </div>

  <aside id="readout">
    <div id="banner" hidden></div>
    <section id="findings"></section>
    <div id="report"></div>
    <div id="notes"></div>
  </aside>
</main>

<div id="busy" hidden><span></span></div>

<script type="module" src="./app.js"></script>
</body>
</html>
