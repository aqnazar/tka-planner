# The suite needs no Blender and no patient data, so it runs anywhere. Both operating
# systems are in the matrix because the paper states the plan is reproducible across
# them, and Node is installed so the viewer's own GLB parser is exercised rather than
# skipped.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -rs

  # The exact dependency set the paper's numbers come from.
  pinned:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -e ".[dev]" -c constraints-paper.txt
      - name: Test
        run: python -m pytest -q -rs
      # The suite imports the checkout, so it cannot see what a real install is
      # missing. Install the built wheel over it and use it from outside the checkout.
      - name: Installed package carries the viewer and the size chart
        shell: bash
        run: |
          python -m pip wheel --no-deps . -w dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from tka_planner.session import find_size_chart; print(find_size_chart())"
          python -c "from tka_planner.server.httpd import WEB_ROOT; assert (WEB_ROOT / 'index.html').is_file(), WEB_ROOT"
          tka landmarks template --out template.mrk.json
